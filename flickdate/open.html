<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in FlickDate</title>
  <meta name="description" content="Tap to open this film or series in the FlickDate app." />
  <meta name="robots" content="noindex" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FlickDate" />
  <meta property="og:title" content="Open in FlickDate" />
  <meta property="og:description" content="Tap to open it in the FlickDate app." />
  <link rel="stylesheet" href="style.css" />
  <style>
    .open-page { text-align: center; padding-top: 56px; }
    .open-page .lead { color: var(--muted); max-width: 520px; margin: 0 auto 28px; }
    .open-btn {
      display: inline-block; background: var(--pink); color: #fff; text-decoration: none;
      padding: 14px 28px; border-radius: 14px; font-weight: 700; font-size: 17px;
    }
    .open-btn[hidden] { display: none; }
    .open-page .updated { margin-top: 28px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><img src="logo.svg" alt="FlickDate" style="height:38px;display:block"/></a>
    <nav class="nav">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main class="narrow page open-page">
    <h1 id="title">Open in FlickDate</h1>
    <p class="lead" id="lead">This link opens a film or series in the FlickDate app.</p>
    <p><a id="open" class="open-btn" href="index.html">Open in FlickDate</a></p>
    <p class="updated"><span id="missing">Don&rsquo;t have FlickDate yet?</span> <a id="more" href="index.html">Find out more</a></p>
  </main>

  <footer class="site-footer">
    <div>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="support.html">Support</a>
      <a href="delete-account.html">Delete Account</a>
    </div>
    <p>&copy; 2026 FlickDate &middot; <a href="mailto:info@digi4all.ai">info@digi4all.ai</a></p>
  </footer>

  <script>
    // Shared links (WhatsApp, Messages, e-mail) point here because "flickdate://..." links are not clickable in chats.
    // This page opens the app on the shared title (?id=123&type=movie|tv) or with a friend's invite code (?code=abc123).
    // Only validated values are ever used: digits for the id, movie/tv for the type, letters/digits for the code.
    (function () {
      var APP = 'FlickDate';
      var SCHEME = 'flickdate';
      var ANDROID_PACKAGE = 'com.flickdate.app';

      var fr = /^fr\b/i.test(navigator.language || '');
      var T = fr ? {
        open: 'Ouvrir dans ' + APP,
        opening: 'Ouverture de ' + APP + '…',
        openingLead: 'Si rien ne se passe, touche le bouton ci-dessous. L’app ' + APP + ' doit être installée sur ce téléphone.',
        invite: 'Rejoins ton ami sur ' + APP,
        inviteLead: 'Le bouton ouvre ' + APP + ' avec son code d’invitation déjà rempli.',
        desktop: 'Ouvre ce lien sur ton téléphone',
        desktopLead: 'Il ouvre ' + APP + ' sur iPhone, iPad ou Android.',
        missing: APP + ' n’est pas installée',
        missingLead: 'Installe ' + APP + ', puis rouvre le lien.',
        invalid: 'Ce lien est incomplet',
        invalidLead: 'Demande à la personne qui l’a partagé de te le renvoyer.',
        notYet: 'Tu n’as pas encore ' + APP + ' ?',
        more: 'En savoir plus'
      } : {
        open: 'Open in ' + APP,
        opening: 'Opening ' + APP + '…',
        openingLead: 'If nothing happens, tap the button below. You need the ' + APP + ' app on this phone.',
        invite: 'Join your friend on ' + APP,
        inviteLead: 'The button opens ' + APP + ' with their invite code already filled in.',
        desktop: 'Open this link on your phone',
        desktopLead: 'It opens ' + APP + ' on iPhone, iPad or Android.',
        missing: APP + ' isn’t installed',
        missingLead: 'Install ' + APP + ', then open the link again.',
        invalid: 'This link is incomplete',
        invalidLead: 'Ask the person who shared it to send it again.',
        notYet: 'Don’t have ' + APP + ' yet?',
        more: 'Find out more'
      };
      if (fr) document.documentElement.lang = 'fr';

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var type = params.get('type') === 'tv' ? 'tv' : 'movie';
      var code = params.get('code');
      var path = null;
      if (id && /^[0-9]{1,10}$/.test(id)) path = 'title?id=' + id + '&type=' + type;
      else if (code && /^[A-Za-z0-9_-]{3,40}$/.test(code)) path = 'pair?code=' + encodeURIComponent(code);

      var ua = navigator.userAgent || '';
      var android = /android/i.test(ua);
      var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var missing = params.get('missing') === '1';

      var title = document.getElementById('title');
      var lead = document.getElementById('lead');
      var button = document.getElementById('open');
      document.getElementById('missing').textContent = T.notYet;
      document.getElementById('more').textContent = T.more;
      button.textContent = T.open;

      if (!path) {
        title.textContent = T.invalid;
        lead.textContent = T.invalidLead;
        button.hidden = true;
        return;
      }

      var appUrl = SCHEME + '://' + path;
      if (android) {
        // Chrome opens the app; if it isn't installed, it comes back here and says so.
        var backParams = new URLSearchParams(window.location.search);
        backParams.set('missing', '1');
        var back = window.location.href.split(/[?#]/)[0] + '?' + backParams.toString();
        appUrl = 'intent://' + path + '#Intent;scheme=' + SCHEME + ';package=' + ANDROID_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
      }
      button.href = appUrl;

      if (missing) {
        title.textContent = T.missing;
        lead.textContent = T.missingLead;
        return;
      }
      if (!android && !ios) {
        title.textContent = T.desktop;
        lead.textContent = T.desktopLead;
        return;
      }
      title.textContent = path.indexOf('pair?') === 0 ? T.invite : T.opening;
      lead.textContent = path.indexOf('pair?') === 0 ? T.inviteLead : T.openingLead;
      // Straight into the app when it's installed (iOS asks "Open in FlickDate?"); the button stays as a fallback.
      setTimeout(function () { window.location.href = appUrl; }, 250);
    })();
  </script>
</body>
</html>
